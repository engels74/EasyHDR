name: Security Audit
jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: taiki-e/install-action@v2.87.8
      with:
        tool: cargo-audit@0.22.2
    - run: cargo audit
    timeout-minutes: 45
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
    - uses: taiki-e/install-action@v2.87.8
      with:
        tool: cargo-deny@0.20.2
    - run: cargo deny --locked check
    timeout-minutes: 45
  cargo-geiger:
    name: Cargo Geiger (Unsafe Code Check)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install fontconfig development headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
    - uses: taiki-e/install-action@v2.87.8
      with:
        tool: cargo-geiger@0.13.0
    - name: Run cargo-geiger
      id: geiger
      continue-on-error: true
      run: cargo geiger --all-features --output-format GitHubMarkdown | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Report Status
      if: always()
      run: |
        if [ "${{ steps.geiger.outcome }}" == "failure" ]; then
          echo "⚠️ Cargo geiger detected issues (informational only)"
        else
          echo "✅ Cargo geiger scan completed"
        fi
    timeout-minutes: 45
    if: github.event_name == 'schedule'
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
  - cron: 0 0 * * *
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
