name: Miri
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
  - cron: 30 0 * * 1
permissions:
  contents: read
jobs:
  miri-portable:
    name: Miri Portable Code
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install fontconfig development headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev
    - name: Setup Rust nightly with Miri
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        toolchain: nightly-2026-09-07
        components: miri
        cache: true
    - name: Run Miri on portable code (error module)
      run: |
        cargo +nightly-2026-09-07 miri test --locked --lib error -- --test-threads=1
      env:
        MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-symbolic-alignment-check
    timeout-minutes: 45
  miri-full:
    name: Miri Full Coverage (Best Effort)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install fontconfig development headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev
    - name: Setup Rust nightly with Miri
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        toolchain: nightly-2026-09-07
        components: miri
        cache: true
    - name: Run Miri on all library tests
      run: cargo +nightly-2026-09-07 miri test --locked --lib -- --test-threads=1
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      continue-on-error: true
    - name: Run Miri with strict checking on all tests
      run: cargo +nightly-2026-09-07 miri test --locked --lib -- --test-threads=1
      env:
        MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
      continue-on-error: true
    timeout-minutes: 45
    if: github.event_name == 'schedule'
concurrency:
  group: miri-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
